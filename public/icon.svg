<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000f1d" />
      <stop offset="50%" stop-color="#092138" />
      <stop offset="100%" stop-color="#0051d5" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#eff4ff" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89f5e7" />
      <stop offset="100%" stop-color="#1e9b8f" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base with subtle squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Shield Emblem Frame -->
  <path d="M256 64 C350 64 400 90 400 90 C400 240 330 380 256 426 C182 380 112 240 112 90 C112 90 162 64 256 64 Z" 
        fill="url(#shieldGrad)" 
        filter="url(#glow)" />

  <!-- Inner Shield Trim -->
  <path d="M256 86 C334 86 376 108 376 108 C376 230 318 350 256 392 C194 350 136 230 136 108 C136 108 178 86 256 86 Z" 
        fill="#000f1d" />

  <!-- Graduation Cap (Mortarboard) -->
  <path d="M256 140 L360 190 L256 240 L152 190 Z" fill="#ffffff" />
  <!-- Cap Underbelly & Skull Cap -->
  <path d="M192 210 L192 260 C192 290 320 290 320 260 L320 210 L256 240 Z" fill="#d3e4fe" />
  <!-- Tassel -->
  <path d="M344 195 L354 280 C354 290 364 290 364 280 L354 195 Z" fill="url(#goldGrad)" />
  <circle cx="359" cy="285" r="7" fill="url(#goldGrad)" />

  <!-- Open Book Pages Symbol -->
  <path d="M190 310 C220 300 250 315 256 320 C262 315 292 300 322 310 L322 360 C292 350 262 365 256 370 C250 365 220 350 190 360 Z" 
        fill="#ffffff" />
  <path d="M256 320 L256 370" stroke="#000f1d" stroke-width="4" stroke-linecap="round" />

  <!-- AI Sparkle / Star Emblem -->
  <path d="M256 100 Q256 122 268 122 Q256 122 256 144 Q256 122 244 122 Q256 122 256 100 Z" fill="url(#goldGrad)" />
  <circle cx="370" cy="120" r="12" fill="#89f5e7" />
  <circle cx="142" cy="120" r="10" fill="#89f5e7" />
</svg>
